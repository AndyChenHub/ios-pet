name: IslandPup
options:
  bundleIdPrefix: com.islandpup
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "1"
    GIT_COMMIT_SHA: "local"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  IslandPup:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IslandPup
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
        excludes:
          - Resources
      - path: Shared/Resources/PetTimerGate-Regular.ttf
        buildPhase: resources
      - path: Shared/Resources/PetTimerGate6s-Regular.ttf
        buildPhase: resources
    info:
      path: IslandPup/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islandpup.app
        INFOPLIST_FILE: IslandPup/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: IslandPupWidgetExtension
        embed: true

  IslandPupWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IslandPupWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
        excludes:
          - Resources
      - path: Shared/Resources/PetTimerGate-Regular.ttf
        buildPhase: resources
      - path: Shared/Resources/PetTimerGate6s-Regular.ttf
        buildPhase: resources
    info:
      path: IslandPupWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islandpup.app.widget
        INFOPLIST_FILE: IslandPupWidget/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  IslandPup:
    build:
      targets:
        IslandPup: all
        IslandPupWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
